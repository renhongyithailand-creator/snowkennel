name: 自动同步数据

on:
  schedule:
    # 每 10 分钟自动同步
    - cron: '*/10 * * * *'
  # 也支持手动触发
  workflow_dispatch:

# 允许推送代码
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 同步数据
        run: node build.js

      - name: 提交更新
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "自动同步 [skip ci]"
          git push
