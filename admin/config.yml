backend:
  name: github
  repo: renhongyithailand-creator/snowkennel
  branch: main
  base_url: https://snowkennel-oauth.renhongyithailand.workers.dev
  auth_endpoint: /auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "dogs"
    label: "🐕 种犬管理"
    editor:
      preview: false
    files:
      - label: "种犬列表"
        name: "stud-dogs"
        file: "data/dogs.json"
        fields:
          - label: "种犬"
            name: "dogs"
            widget: "list"
            summary: "{{name}}"
            fields:
              - {label: "中文名", name: "name", widget: "string"}
              - {label: "英文名", name: "name_en", widget: "string"}
              - {label: "照片", name: "photo", widget: "image", required: false}
