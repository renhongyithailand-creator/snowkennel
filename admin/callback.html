<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<h2>登录回调</h2>
<p id="log"></p>
<script>
var logEl = document.getElementById('log');
function log(m) { logEl.textContent += m + '\n'; }
log('URL hash: ' + location.hash);
log('window.opener: ' + (window.opener ? '✅ 存在' : '❌ null'));
var token = location.hash.substring(1);
if (token && window.opener) {
  log('发送 postMessage...');
  window.opener.postMessage({token: token}, '*');
  log('postMessage 已发送');
  log('3秒后关闭此窗口');
  setTimeout(function(){ window.close(); }, 3000);
} else if (!token) {
  log('❌ 没有 token');
} else {
  log('❌ window.opener 不存在，可能是浏览器拦截了弹窗');
  log('请手动复制 token 并关闭窗口');
}
</script>
</body></html>
