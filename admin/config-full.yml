# ═══════════════════════════════════════
# 思糯犬舍 · Decap CMS 配置
# ═══════════════════════════════════════

backend:
  name: github
  repo: renhongyithailand-creator/snowkennel
  branch: main
  # OAuth 代理地址 — 第 4 步部署后替换为实际地址
  base_url: https://snowkennel-oauth.renhongyithailand.workers.dev
  auth_endpoint: /auth

# 上传的图片保存在仓库的 images/ 目录
media_folder: "images"
public_folder: "/images"

# 网站地址（用于 CMS 中的预览链接）
site_url: https://www.snowkennel.com
display_url: https://www.snowkennel.com

# ═══════════════════════════════════════
# 内容集合
# ═══════════════════════════════════════
collections:
  # ── 网站设置 ──
  - name: "settings"
    label: "⚙️ 网站设置"
    editor:
      preview: false
    files:
      - label: "全局设置"
        name: "site-settings"
        file: "data/settings.json"
        fields:
          - label: "Hero 区域"
            name: "hero"
            widget: "object"
            summary: "{{tag}}"
            fields:
              - {label: "Hero 照片", name: "photo", widget: "image", required: false}
              - {label: "标签文字", name: "tag", widget: "string", default: "Giant Schnauzer · 专业繁育"}
              - {label: "描述文字", name: "desc", widget: "text", default: "致力于繁育<strong>体型优美、性格稳定</strong>的巨型雪纳瑞<br>每一只幼犬，都是我们用心呵护的家人"}

          - label: "关于我们"
            name: "about"
            widget: "object"
            fields:
              - {label: "英文标签", name: "label_en", widget: "string", default: "About Us"}
              - {label: "中文标签", name: "label_cn", widget: "string", default: "关于思糯"}
              - {label: "英文副标题", name: "subtitle_en", widget: "string", default: "Our Story"}
              - {label: "标题", name: "heading", widget: "string", default: "以爱之名，繁育品质"}
              - {label: "正文（段落用空行分隔）", name: "text", widget: "text"}
              - {label: "底部高亮文字", name: "footer", widget: "string", default: "Breeding with love, raising with care"}
              - {label: "照片", name: "photo", widget: "image", required: false}

          - label: "各区块标签"
            name: "labels"
            widget: "object"
            fields:
              - {label: "犬种介绍 — 英文", name: "breed_label_en", widget: "string", default: "Breed Introduction"}
              - {label: "犬种介绍 — 中文", name: "breed_label_cn", widget: "string", default: "巨型雪纳瑞"}
              - {label: "犬种介绍 — 英文副标题", name: "breed_subtitle_en", widget: "string", default: "The Giant Schnauzer"}
              - {label: "种犬展示 — 英文", name: "dogs_label_en", widget: "string", default: "Our Dogs"}
              - {label: "种犬展示 — 中文", name: "dogs_label_cn", widget: "string", default: "种犬展示"}
              - {label: "种犬展示 — 英文副标题", name: "dogs_subtitle_en", widget: "string", default: "Stud Dogs & Dams"}
              - {label: "照片墙 — 英文", name: "gallery_label_en", widget: "string", default: "Gallery"}
              - {label: "照片墙 — 中文", name: "gallery_label_cn", widget: "string", default: "犬舍风采"}
              - {label: "照片墙 — 英文副标题", name: "gallery_subtitle_en", widget: "string", default: "Our Life & Puppies"}
              - {label: "联系我们 — 英文", name: "contact_label_en", widget: "string", default: "Contact"}
              - {label: "联系我们 — 中文", name: "contact_label_cn", widget: "string", default: "联系我们"}
              - {label: "联系我们 — 英文副标题", name: "contact_subtitle_en", widget: "string", default: "Get In Touch"}

          - label: "联系方式"
            name: "contact"
            widget: "object"
            fields:
              - {label: "标题", name: "heading", widget: "string", default: "欢迎预约来访"}
              - {label: "犬舍地址", name: "address", widget: "string"}
              - {label: "联系电话", name: "phone", widget: "string"}
              - {label: "电子邮箱", name: "email", widget: "string"}
              - {label: "微信号", name: "wechat", widget: "string"}
              - {label: "微信二维码", name: "qr_photo", widget: "image", required: false}
              - {label: "二维码提示", name: "qr_hint", widget: "string", default: "扫码添加微信，了解更多犬只信息"}

          - label: "页脚"
            name: "footer"
            widget: "object"
            fields:
              - {label: "版权文字", name: "text", widget: "string"}

  # ── 犬种特性 ──
  - name: "traits"
    label: "🧬 犬种特性"
    editor:
      preview: false
    files:
      - label: "特性列表"
        name: "breed-traits"
        file: "data/traits.json"
        fields:
          - label: "特性"
            name: "traits"
            widget: "list"
            summary: "{{icon}} {{title}}"
            fields:
              - {label: "图标 Emoji", name: "icon", widget: "string", default: "🛡️"}
              - {label: "中文标题", name: "title", widget: "string", default: "新特性"}
              - {label: "英文标签", name: "en_label", widget: "string", default: "Feature"}
              - {label: "描述", name: "description", widget: "text"}

  # ── 种犬管理 ──
  - name: "dogs"
    label: "🐕 种犬管理"
    editor:
      preview: false
    files:
      - label: "种犬列表"
        name: "stud-dogs"
        file: "data/dogs.json"
        fields:
          - label: "种犬"
            name: "dogs"
            widget: "list"
            summary: "{{name}} — {{title}}"
            fields:
              - {label: "中文名", name: "name", widget: "string", default: "名称待定"}
              - {label: "英文名/血系", name: "name_en", widget: "string"}
              - {label: "头衔", name: "title", widget: "string"}
              - {label: "描述", name: "description", widget: "text"}
              - {label: "照片", name: "photo", widget: "image", required: false}
              - {label: "肩高", name: "height", widget: "string", default: "65cm"}
              - {label: "体重", name: "weight", widget: "string", default: "40kg"}
              - {label: "遗传", name: "genetics", widget: "string", default: "A/A"}

  # ── 照片墙 ──
  - name: "gallery"
    label: "🖼️ 照片墙"
    editor:
      preview: false
    files:
      - label: "照片列表"
        name: "photo-gallery"
        file: "data/gallery.json"
        fields:
          - label: "照片"
            name: "gallery"
            widget: "list"
            summary: "{{label}} ({{layout}})"
            fields:
              - {label: "标题", name: "label", widget: "string", default: "新照片"}
              - label: "布局"
                name: "layout"
                widget: "select"
                options:
                  - {label: "普通", value: ""}
                  - {label: "高（占两行）", value: "tall"}
                  - {label: "宽（占两列）", value: "wide"}
              - {label: "照片", name: "photo", widget: "image", required: false}
